<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
    <title>Priscilla Leonard's Business Card</title>
</head>
<body>
    <main class="card" tabindex="0" role="button">
        <div class="card-inner">
            <section class="card-face card-front">
                <img src="../images/p_linkIn2.jpg" class="photo" alt="Priscilla Leonard Photo">
                <div class="info-container">
                    <h1>Priscilla Leonard</h1>
                    <h2>Software Engineering Student</h2>
                    <p>JavaScript • TypeScript • HTML • CSS • React • Git • Vite</p>
                </div>
            </section>
            <section class="card-face card-back">
                <a
                    href="https://www.linkedin.com/in/priscillaleonard/"
                    id="link"
                    target="_blank"
                ><img src="../images/linkedIn_qr.png" class="qr-code" alt="QR Code to LinkedIn Profile"></a>
                <p>Let's connect.<br />
                    Scan or tap to visit my LinkedIn.
                </p>
            </section>
        </div>
    </main>
</body>
</html>
